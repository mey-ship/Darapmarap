gc_expanded_infrastructure_network_tt:0 "§YExpanded Infrastructure§! grants additional bonuses. Most of these bonuses scale recursively: from the §Y2nd level§! onward, each level adds one base bonus and then increases the accumulated bonus by §G50%§!. Construction and recruitment speed bonuses scale normally. Each level also grants §G-15% Local Governing Cost§!, while the additional flat Governing Cost is §R+25§! at the first level and §R+10§! for each level thereafter. §YDevelopment Cost§! and §YGreat Project Upgrade Cost§! are excluded.\n\n§RThe additional Infrastructure bonuses are capped at 5 Expanded Infrastructure levels.§!"
  gc_regulation_bureau_tt:0 "§YProvince Improvement§! grants §G+1§! Base Goods Produced and §R+5§! Local Governing Cost."
 gc_efficient_construction_plans_tt:0 "§YProvincial Investments§! from buildings provide §G3x§! the normal Development Cost modifier."
