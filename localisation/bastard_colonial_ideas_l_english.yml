l_english:

 # ================= BEO (Beornia / La Plata) - sourced from bastardo_l_english =================
 lap_1:0 "Wealth of the Atacama"
 lap_1_desc:0 "The mineral riches of the Atacama and its surrounding highlands can be turned into a steady flow of goods for our merchants to sell."
 lap_2:0 "Transverse Valleys"
 lap_2_desc:0 "The fertile valleys running down from the Andes give our realm a name and a history worth being proud of."
 lap_3:0 "Sun of May"
 lap_3_desc:0 "The spirit that first rallied our people against foreign rule still steels the hearts of our soldiers against every reversal."
 lap_4:0 "Made of Steel"
 lap_4_desc:0 "Our arsenals and foundries turn out well-drilled regiments hardened against the shock of battle."
 lap_5:0 "Made of Silver"
 lap_5_desc:0 "The silver mines of our highlands remain among the richest in the world, and we intend to keep it that way."
 lap_6:0 "Hardy People"
 lap_6_desc:0 "Generations spent settling harsh plains and windswept passes have made our people resilient to hardship of every kind."
 lap_7:0 "The Beornian"
 lap_7_desc:0 "Our national character is now fully formed - proud, self-reliant, and unmistakably our own."

 # ================= HER (Hereria / Colombia) - sourced from bastardo_l_english =================
 col_1:0 "Sons of Bolivar"
 col_1_desc:0 "The dream of a great, unified nation across these lands inspires our soldiers to fight harder for their homeland."
 col_2:0 "Gran Colombia"
 col_2_desc:0 "Our vision of a single great republic spanning the north of the continent continues to steady our institutions."
 col_3:0 "Jungle Plantations"
 col_3_desc:0 "Clearing and cultivating the dense jungle interior has proven more profitable than anyone expected."
 col_4:0 "Muisca Heritage"
 col_4_desc:0 "The old traditions of the highland peoples still strengthen the resolve of those who share their faith."
 col_5:0 "Little Hell"
 col_5_desc:0 "Our soldiers have earned a fearsome reputation in the mountain passes and jungle trails few outsiders dare follow."
 col_6:0 "Patrol the Caribbean"
 col_6_desc:0 "Our galleons keep a watchful eye on the Caribbean approaches, protecting our trade from privateers and rivals alike."
 col_7:0 "Sublime Liberty"
 col_7_desc:0 "The ideals that first freed us from foreign rule continue to inspire the institutions of our republic."

 # ================= FRE (Freiland / Caribbean) - sourced from bastardo_l_english =================
 cub_1:0 "Privateer Spirit"
 cub_1_desc:0 "By using the ideas and tactics of the famous pirate Michael Bolton, we can use his spirit and bravery to defy typical warfare and opt for a more prolonged siege warfare accompanied by new rams to more efficiently capture enemy ships."
 cub_2:0 "Impressment"
 cub_2_desc:0 "By capturing foreign sailors or pirates, we can force these men to join our navies and do the hard work! By becoming real swashbuckling buccaneers we can increase our stockpile of sailors dramatically."
 cub_3:0 "The Arsenal"
 cub_3_desc:0 "By expanding our Arsenal of ships and allowing for cheaper ships to be built, we can build a grand navy worthy of the Seven Seas. Only with a large and modern navy can we assert dominance in the region"
 cub_4:0 "Sugar and Slaves"
 cub_4_desc:0 "With almost a monopoly on Sugar and Slavery running rampant throughout our lands, we can combine these two factors in order to more efficiently produce and manufacture Sugar. We should begin by promoting these Sugar Plantations."
 cub_5:0 "The Crossroads"
 cub_5_desc:0 "Cuba is caught in the crossroads of the trade between the New World and the Old World, by taxing merchants more for their goods and creating higher tariffs we can more easily turn a profit."
 cub_6:0 "Coartacion"
 cub_6_desc:0 "By reforming our system of Slavery we can promote intellectual thought from perhaps former slaves, by allowing them to buy their own freedom we can fill our coffers and also reap the intellectual bonuses."
 cub_7:0 "The Bourbon Reforms"
 cub_7_desc:0 "By allowing the Bourbon Reforms to occur in our country, we can benefit from increased administrative control of our country and allow for our rulers to be elected more often to retain their ideas."

 # ================= AME (Ameriga / Brazil) - written =================
 governorate_general:0 "Governorate-General"
 governorate_general_desc:0 "A single unified administration over our Brazilian holdings speeds every reform we undertake."
 research_of_nassau:0 "Research of Nassau"
 research_of_nassau_desc:0 "The scientific surveys first commissioned under Nassau's governorship continue to bear fruit, feeding new ideas into our institutions."
 mines_of_minas_gerais:0 "Mines of Minas Gerais"
 mines_of_minas_gerais_desc:0 "The gold fields of Minas Gerais remain a cornerstone of our economy, and we intend to keep them productive for generations to come."
 halting_foreign_incursions:0 "Halting Foreign Incursions"
 halting_foreign_incursions_desc:0 "Coastal batteries and quick-reacting garrisons make any foreign landing on our shores a costly affair."
 entradas_and_bandeiras:0 "Entradas and Bandeiras"
 entradas_and_bandeiras_desc:0 "Our frontier expeditions into the interior bring back not just land and slaves, but knowledge of the land itself."
 inconfidencia_mineira:0 "Inconfidência Mineira"
 inconfidencia_mineira_desc:0 "The memory of those who first conspired for our independence steels our soldiers' discipline on the field."
 old_seat_of_the_empire:0 "Old Seat of the Empire"
 old_seat_of_the_empire_desc:0 "Having once housed the seat of a great empire, our institutions carry a legitimacy that steadies the republic."

 # ================= GCA (Grand Columbia / Mexico) - written =================
 cam_1:0 "Grand Commissariat"
 cam_1_desc:0 "A dedicated corps of quartermasters keeps our armies fed, equipped, and quick to recover after every campaign."
 cam_2:0 "Arm the Masses"
 cam_2_desc:0 "Calling up levies from every town and village swells our ranks cheaply, even if they fight with less polish than professional troops."
 cam_3:0 "Imperial Schools"
 cam_3_desc:0 "A network of schools modeled on the old imperial system spreads new learning through our realm at a fraction of the usual cost."
 cam_4:0 "Forced Conversion"
 cam_4_desc:0 "Bringing our subjects into a single faith and culture, however forcefully, has strengthened the loyalty of our heartland provinces."
 cam_5:0 "Highland Conscription"
 cam_5_desc:0 "The hardy peoples of our highlands make for willing and swiftly-replenished recruits."
 cam_6:0 "Redoubts"
 cam_6_desc:0 "A programme of fieldworks and fortified positions makes every one of our garrisons harder to dislodge."
 cam_7:0 "Militia"
 cam_7_desc:0 "Armed townsfolk and rural levies stand ready to swell our regular forces whenever war demands it."

 # ================= PLA (Plantagenia / Louisiana-Mississippi) - written =================
 lou_1:0 "Masters of the Gulf"
 lou_1_desc:0 "Our merchant fleets dominate the trade routes of the Gulf, and our reputation as its masters only grows."
 lou_2:0 "Port of New Orleans"
 lou_2_desc:0 "The great port at the mouth of the Mississippi has become one of the busiest harbours in the New World."
 lou_3:0 "Breadbasket of America"
 lou_3_desc:0 "The rich alluvial soil of the Mississippi basin makes our territory one of the most productive farmlands on the continent."
 lou_4:0 "Voodoo"
 lou_4_desc:0 "The syncretic faith practiced throughout our lowlands unsettles our enemies as much as it steadies our own people."
 lou_5:0 "Mississippi Watershed"
 lou_5_desc:0 "The river and its many tributaries let us move men, goods, and settlers into the interior at a fraction of the usual cost."
 lou_6:0 "Slave Labor"
 lou_6_desc:0 "The plantation economy of our lowlands, built on forced labour, lets us raise new buildings quickly and cheaply."
 lou_7:0 "Soldiers of Fortune"
 lou_7_desc:0 "Adventurers and traders drawn to our frontier bring with them connections that smooth the wheels of commerce."

 # ================= ARC (Arcadia / Eastern America) - written =================
 freedom_of_religion:0 "Freedom of Religion"
 freedom_of_religion_desc:0 "By guaranteeing every faith a place in our society, we draw settlers of every creed and spare ourselves the cost of religious strife."
 usa_bill_of_rights:0 "A Bill of Rights"
 usa_bill_of_rights_desc:0 "Enshrining the rights of our citizens in law has given our republic an unshakeable foundation."
 empire_of_liberty:0 "Empire of Liberty"
 empire_of_liberty_desc:0 "Our reputation as a haven of liberty draws the eyes, and the admiration, of courts across the world."
 lessons_of_valley_forge:0 "Lessons of Valley Forge"
 lessons_of_valley_forge_desc:0 "The hard winters that first tempered our armies taught discipline and resolve that our soldiers have never forgotten."
 workshop_of_the_world:0 "Workshop of the World"
 workshop_of_the_world_desc:0 "Our workshops and manufactories now turn out goods on a scale that rivals the old powers of Europe."
 shining_city_on_a_hill:0 "Shining City on a Hill"
 shining_city_on_a_hill_desc:0 "The example our nation sets inspires fierce loyalty at home and grudging respect from any who would move against us."
 indian_removal:0 "Indian Removal"
 indian_removal_desc:0 "A deliberate policy of resettlement has opened our frontier provinces to faster, cheaper development at a heavy human cost."

 # ================= VIN (Vinland / Canada) - written =================
 singing_lumberjacks:0 "Singing Lumberjacks"
 singing_lumberjacks_desc:0 "Our timber camps supply goods in far greater quantity than their modest size would suggest."
 the_hudson_bay_company:0 "The Hudson Bay Company"
 the_hudson_bay_company_desc:0 "Our chartered trading company's network of posts across the north gives our diplomats reach far beyond our borders."
 settling_the_interior:0 "Settling the Interior"
 settling_the_interior_desc:0 "Organised settlement of the interior lowers the cost of developing our vast and sparsely populated territory."
 the_maritimes:0 "The Maritimes"
 the_maritimes_desc:0 "Generations of fishing and shipbuilding along our eastern coast have given us sailors and marines without equal."
 the_quebec_act:0 "The Quebec Act"
 the_quebec_act_desc:0 "Guaranteeing the customs and laws of our French-speaking subjects has kept the republic unified rather than divided."
 legacy_of_the_empire:0 "Legacy of the Empire"
 legacy_of_the_empire_desc:0 "Institutions inherited from our former imperial masters ease the embrace of new ideas from across the world."
 the_forests_of_canada:0 "The Forests of Canada"
 the_forests_of_canada_desc:0 "The vast timber reserves of our northern forests lower the cost of every construction project we undertake."

 # ================= LUS (Lusitania / Rio Grande-Texas) - written =================
 lone_star_state:0 "Lone Star State"
 lone_star_state_desc:0 "Our fierce independence, first won on the plains, remains a point of pride for every citizen of our republic."
 tex_revolution:0 "Rangers of the Frontier"
 tex_revolution_desc:0 "Mounted companies of frontier rangers give our infantry a sharper edge in every engagement."
 cotton_plantations:0 "Cotton Plantations"
 cotton_plantations_desc:0 "The rich soil of our lowlands has made cotton the backbone of our economy."
 vaqueros:0 "Vaqueros"
 vaqueros_desc:0 "Generations of cattle herders have given our republic horsemen without equal on the frontier."
 tex_native_frontiers:0 "Native Frontiers"
 tex_native_frontiers_desc:0 "Long experience campaigning across open plains has taught our armies to move fast and live off the land."
 tejanos:0 "Tejanos"
 tejanos_desc:0 "The mixed heritage of our frontier settlers has bred a resilient population, quick to recover from the hardships of war."
 adelsverin:0 "The Adelsverein"
 adelsverin_desc:0 "Organised societies of settlers from across the ocean continue to swell our ranks with disciplined new colonists."
